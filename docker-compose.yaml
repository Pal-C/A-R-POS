services:
  db:
    image: postgres:18
    container_name: ace_rally_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ace_rally
      POSTGRES_USER: ace_admin
      POSTGRES_PASSWORD: change_this_local_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
